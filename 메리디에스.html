<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>메리디에스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Serif+KR:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Nanum+Pen+Script&display=swap">
<style>
/* Layout: mobile-first app shell — sticky header, single feed column, bottom tab bar; ≥900px the tab bar becomes a left rail and the character menu a floating button. */
:root{
  --bg:#FAFAF7; --surface:#FAFAF7; --sunk:#F0EFEA; --ink:#141414; --muted:#737373; --line:#E6E5E0;
  --primary:#141414; --on-primary:#FAFAF7; --accent:#9A7B4F; --gold:#9A7B4F; --gold-soft:#F1ECE2;
  --good:#3D7358; --warn:#9A7230; --crit:#A0443F;
  --aurora:#86394B; --vesper:#8DAA6A; --candida:#D3AE4A; --astra:#4B4D93; --fifth-line:#A3A39C;
  --av-bg:#ECEBE6; --av-fg:#D3D2CC;
  --paper:#F3EBD8; --paper-line:#DDD0B0; --paper-ink:#3A2E1E; --seal:#7E3444;
  --f-display:"Noto Serif KR","Nanum Myeongjo",serif;
  --f-latin:"Cormorant Garamond","Times New Roman",serif;
  --f-body:"IBM Plex Sans KR","Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --f-hand:"Nanum Pen Script","Nanum Myeongjo",cursive;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121212; --surface:#121212; --sunk:#1D1D1D; --ink:#EDEDEA; --muted:#9A9A9A; --line:#2A2A2A;
  --primary:#EDEDEA; --on-primary:#121212; --accent:#C9AB7A; --gold:#C9AB7A; --gold-soft:#29241B;
  --good:#86C1A0; --warn:#D9B36E; --crit:#E08B85;
  --aurora:#B25A6E; --vesper:#A3C47E; --candida:#E0C062; --astra:#8285D6; --fifth-line:#6E7078;
  --av-bg:#222222; --av-fg:#3A3A3A; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121212; --surface:#121212; --sunk:#1D1D1D; --ink:#EDEDEA; --muted:#9A9A9A; --line:#2A2A2A;
  --primary:#EDEDEA; --on-primary:#121212; --accent:#C9AB7A; --gold:#C9AB7A; --gold-soft:#29241B;
  --good:#86C1A0; --warn:#D9B36E; --crit:#E08B85;
  --aurora:#B25A6E; --vesper:#A3C47E; --candida:#E0C062; --astra:#8285D6; --fifth-line:#6E7078;
  --av-bg:#222222; --av-fg:#3A3A3A; color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);font-weight:800;line-height:1.3;text-wrap:balance;margin:0}
.lat{font-family:var(--f-latin);font-style:italic;letter-spacing:.01em}
.muted{color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* header */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:10px;height:56px;padding-inline:16px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.brand b{font-family:var(--f-display);font-size:19px;letter-spacing:.02em}
.brand .lat{color:var(--muted);font-size:15px}
.topbar .title{font-family:var(--f-display);font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;position:relative;flex:none}
.icon-btn:hover{background:var(--sunk)}
.spacer{flex:1}
.badge{position:absolute;top:4px;right:2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--crit);color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center}
.char-btn .av{width:34px;height:34px}

/* main */
#main{max-width:640px;margin-inline:auto;padding-inline:16px;padding-block:12px calc(96px + env(safe-area-inset-bottom,0px))}
[data-view="room"] #main,[data-view="scene"] #main{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;font-size:11px;color:var(--muted);min-height:56px}
.tab[aria-current="page"]{color:var(--ink);font-weight:700}
.tab[aria-current="page"] svg{stroke:var(--gold)}
.rail-brand{display:none}
.char-fab{display:none}
@media (max-width:899px){
  [data-view="room"] .tabbar,[data-view="scene"] .tabbar{display:none}
}
@media (min-width:900px){
  body{padding-left:232px}
  .tabbar{top:0;right:auto;width:232px;grid-template-columns:1fr;grid-auto-rows:min-content;border-top:0;border-right:1px solid var(--line);padding:20px 12px;gap:4px}
  .rail-brand{display:flex;flex-direction:column;gap:2px;padding:4px 12px 20px}
  .rail-brand b{font-family:var(--f-display);font-size:22px}
  .tab{flex-direction:row;gap:12px;font-size:15px;padding:10px 12px;min-height:0;border-radius:var(--r)}
  .tab:hover{background:var(--sunk)}
  .tab[aria-current="page"]{background:var(--sunk)}
  .topbar .brand{display:none}
  .topbar .char-btn{display:none}
  .char-fab{display:flex;position:fixed;right:24px;bottom:24px;z-index:35;align-items:center;gap:10px;padding:6px 16px 6px 6px;border-radius:30px;background:var(--primary);color:var(--on-primary);box-shadow:0 6px 24px #0003;font-weight:500}
  .char-fab .av{width:40px;height:40px}
  .char-fab .badge{top:-2px;right:-2px}
}

/* avatars */
svg.av{width:42px;height:42px;flex:none;border-radius:50%;display:block}
svg.av.lg{width:84px;height:84px}
svg.av.sm{width:30px;height:30px}

/* chips & buttons */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 14px;border-radius:20px;border:1px solid var(--line);background:var(--surface);font-size:13px;white-space:nowrap;min-height:34px}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:var(--r);background:var(--primary);color:var(--on-primary);font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{min-height:36px;padding:0 12px;font-size:13px}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.dorm-tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.dorm-dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11.5px;font-weight:700;background:var(--sunk);color:var(--muted)}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.pill.accent{background:var(--sunk);color:var(--ink)}

/* sun strip */
.sunstrip{display:flex;align-items:center;gap:12px;padding:10px 14px;margin:4px 0 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);font-size:13px}
.sunbar{flex:1;height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;position:relative;min-width:60px}
.sunbar i{position:absolute;inset:0 auto 0 0;width:25%;background:var(--gold);opacity:.7}

/* feed */
.notice{display:flex;gap:10px;padding:12px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);margin-bottom:12px;font-size:14px}
.notice b{color:var(--ink)}
.notice svg{color:var(--gold)}
.feed{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.post{display:grid;grid-template-columns:42px minmax(0,1fr);gap:12px;padding:14px;border-bottom:1px solid var(--line)}
.post:last-child{border-bottom:0}
.post>button,.msg>button,.composebox>svg{align-self:start}
.post-head{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.post-head .name{font-weight:700}
.post-body{margin:4px 0 8px;white-space:pre-wrap;word-break:break-word}
.imgs{display:grid;gap:4px;border-radius:var(--r);overflow:hidden;margin-bottom:8px}
.imgs.n2,.imgs.n4{grid-template-columns:1fr 1fr}
.imgs.n3{grid-template-columns:1fr 1fr}.imgs.n3 img:first-child{grid-row:span 2}
.imgs img{width:100%;height:100%;max-height:340px;object-fit:cover;display:block;background:var(--sunk);aspect-ratio:4/3}
.imgs.n1 img{aspect-ratio:auto}
.actions{display:flex;gap:4px;margin-left:-8px;flex-wrap:wrap}
.act{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 10px;border-radius:18px;font-size:13px;color:var(--muted)}
.act:hover{background:var(--sunk)}
.act.talk{color:var(--ink)}
.act.talk.has{color:var(--gold)}
.act.talk.has svg{fill:color-mix(in srgb,var(--gold) 18%,transparent)}
.act.on{color:var(--accent)}
.act.on svg{fill:currentColor}
.composebox{display:grid;grid-template-columns:42px minmax(0,1fr);gap:12px;padding:14px;margin-bottom:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.composebox textarea{width:100%;border:0;background:transparent;resize:none;font-size:16px;line-height:1.55;padding:8px 0;min-height:52px}
.composebox textarea:focus{outline:none}
.composebox:focus-within{border-color:var(--muted)}
.cb-actions{display:flex;align-items:center;gap:6px;border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.cb-actions .icon-btn{margin-left:-10px;color:var(--gold)}
.composer{flex-wrap:wrap}
.composer .preview-imgs{flex-basis:100%;margin:0 0 4px}
.composer .icon-btn{color:var(--gold);flex:none}
.msg-img{display:block;max-width:100%;max-height:320px;border-radius:8px;margin-top:8px}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:25;width:56px;height:56px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;box-shadow:0 6px 20px #0003}
@media (min-width:900px){.fab{right:auto;left:calc(232px + 50% - 116px + 320px - 28px);bottom:96px}}
@media (min-width:900px){.fab{left:auto;right:32px;bottom:100px}}

/* section headings */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:20px 0 10px}
.sec-h h2{font-size:18px}
.eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* lists */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;width:100%;min-height:56px}
.row:last-child{border-bottom:0}
.row:hover{background:var(--sunk)}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:700;display:block}
.row .s{font-size:13px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unread-dot{width:8px;height:8px;border-radius:50%;background:var(--crit);flex:none}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:14px}

/* roleplay room */
.rp-head{display:flex;align-items:center;gap:10px;padding:12px 0}
.rp-msgs{display:flex;flex-direction:column;gap:14px}
.origin{border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:var(--r);padding:12px 14px;background:var(--surface)}
.origin .eyebrow{display:block;margin-bottom:6px;color:var(--gold)}
.msg{display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px}
.msg svg.av{width:36px;height:36px}
.msg .bubble{background:var(--surface);border:1px solid var(--line);border-radius:4px var(--r) var(--r) var(--r);padding:10px 14px}
.msg.mine .bubble{background:var(--sunk);border-color:transparent}
.msg .who{font-size:13px;font-weight:700;margin-bottom:2px;display:flex;gap:6px;align-items:baseline}
.msg .txt{white-space:pre-wrap;word-break:break-word}
.jimun{color:var(--muted)}
.composer{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:flex-end}
@media (min-width:900px){.composer{left:232px;padding-right:200px}}
@media (max-width:899px){[data-view="dorm"] .composer{bottom:calc(56px + env(safe-area-inset-bottom,0px));padding-bottom:10px}}
[data-view="dorm"] #main{padding-bottom:calc(170px + env(safe-area-inset-bottom,0px))}
.composer textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:10px 12px;min-height:44px;max-height:40vh;font-size:16px;line-height:1.5}
.composer .hint{position:absolute;top:-22px;left:16px;font-size:11.5px;color:var(--muted)}
.readonly-bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--sunk);border-top:1px solid var(--line);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));text-align:center;font-size:13px;color:var(--muted)}
@media (min-width:900px){.readonly-bar{left:232px}}

/* profile */
.prof-card{display:flex;gap:16px;align-items:center;padding:18px 0 12px}
.prof-card h1{font-size:24px}
.prof-meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:4px;font-size:13px}
.prof-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 16px}
.prof-actions .btn{padding:0 8px;font-size:14px}
.job-live{font-size:12px;font-weight:500;opacity:.85}
.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:1 0 auto;padding:12px 12px;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:700;border-color:var(--gold)}
.kv{display:grid;grid-template-columns:88px minmax(0,1fr);gap:8px 12px;margin:0 0 14px}
.kv dt{color:var(--muted);font-size:13px;padding-top:2px}
.kv dd{margin:0}
.prose{white-space:pre-wrap;word-break:break-word}
.fullbody{display:flex;justify-content:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.fullbody svg{width:min(240px,70%);height:auto}
.grades{display:flex;flex-direction:column;gap:2px}
.grade-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.grade-row .nm{font-weight:500}
.grade-row .gr{font-family:var(--f-latin);font-style:italic;font-size:18px;font-weight:600;text-align:right;line-height:1.2}
.grade-row .bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.grade-row .bar i{display:block;height:100%;border-radius:3px}
.grade-row .sc{grid-column:1/-1;font-size:12px;color:var(--muted)}
.g0{color:var(--crit)}.g1{color:var(--warn)}.g2{color:var(--muted)}.g3{color:var(--good)}.g4{color:var(--gold)}
.b0{background:var(--crit)}.b1{background:var(--warn)}.b2{background:var(--muted)}.b3{background:var(--good)}.b4{background:var(--gold)}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.inv-item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 8px;text-align:center;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:6px}
.inv-item svg.ic{width:28px;height:28px;color:var(--gold)}
.money{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);margin-bottom:14px}
.money b{font-size:20px;font-family:var(--f-display)}
.tx{font-size:13px}
.tx .row{min-height:44px;padding:8px 14px}
.plus{color:var(--good)}.minus{color:var(--crit)}

/* shop */
.shop-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:560px){.shop-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.shop-item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.shop-item .art{height:72px;border-radius:8px;background:var(--sunk);display:grid;place-items:center;color:var(--gold)}
.shop-item .art svg.ic{width:34px;height:34px}
.shop-item .nm{font-weight:700;line-height:1.35}
.shop-item .pr{font-size:13px;color:var(--muted)}
.balance{position:sticky;top:calc(56px + env(safe-area-inset-top,0px));z-index:10;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;margin:0 0 12px;border-radius:var(--r);background:var(--primary);color:var(--on-primary);font-size:14px}
.balance b{font-family:var(--f-display);font-size:16px}

/* calendar */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-grid .dow{font-size:11.5px;color:var(--muted);padding:4px 0}
.cal-day{aspect-ratio:1;max-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:8px;font-size:14px;font-variant-numeric:tabular-nums;width:100%}
.cal-day.out{color:var(--line)}
.cal-day.today{font-weight:700;color:var(--gold)}
.cal-day[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.cal-dots{display:flex;gap:2px;height:5px}
.cal-dots i{width:5px;height:5px;border-radius:50%}
.cat-event{background:var(--aurora)}.cat-story{background:var(--gold)}.cat-notice{background:var(--muted)}.cat-academic{background:var(--astra)}
.ev{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev .d{text-align:center;line-height:1.15}
.ev .d b{display:block;font-size:20px;font-family:var(--f-display)}
.ev .d span{font-size:11.5px;color:var(--muted)}
.ev .t{font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}

/* dorm */
.crest-card{display:flex;gap:16px;align-items:center;padding:18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);margin:8px 0 6px}
.crest-card h1{font-size:22px}
.crest-card p{margin:2px 0 0;font-size:13.5px;color:var(--muted)}
.dorm-strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:10px}
.dorm-cell{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 2px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-size:11.5px;text-align:center;min-width:0}
.dorm-cell.mine{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}

/* docs */
.doc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 18px}

.doc li{margin-bottom:6px}
.doc .lead{color:var(--muted);font-size:14px;border-left:3px solid var(--gold);padding-left:12px}
.toc{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}

/* character grid */
.char-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.char-tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}

/* drawer */
.scrim{position:fixed;inset:0;background:#0007;z-index:50}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:51;width:min(400px,90vw);background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:-10px 0 30px #0003;animation:slidein .22s ease-out}

.drawer-head{display:flex;align-items:center;gap:12px;padding:16px;border-bottom:1px solid var(--line)}
.drawer-head .grow{flex:1;min-width:0}
.drawer-body{flex:1;overflow-y:auto;padding:12px 16px 24px}
.drawer .tabs{padding:0 16px;margin:0}

/* sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;max-height:90vh;overflow-y:auto;background:var(--bg);border-radius:18px 18px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.5}}

#sheet-root .scrim{z-index:60}
.sheet h2{font-size:19px;margin:4px 0 12px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label,.field .lb{font-size:13px;font-weight:700;color:var(--muted)}
.field input[type=text],.field input[type=number],.field input[type=date],.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px;font-size:16px;min-height:44px}
.field textarea{resize:vertical;min-height:110px;line-height:1.55}
.quote{border-left:3px solid var(--gold);padding:8px 12px;background:var(--surface);border-radius:0 8px 8px 0;margin-bottom:14px;font-size:14px}

.sheet-actions{display:flex;gap:8px;margin-top:8px}
.sheet-actions .btn{flex:1}
.pick{display:flex;flex-direction:column;gap:8px}
.pick-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-align:left;width:100%}
.pick-item:hover{border-color:var(--gold)}

.pick-item .rate{font-family:var(--f-display);font-size:18px}
.result{text-align:center;padding:18px 8px}
.result .big{font-family:var(--f-display);font-size:30px;font-weight:800;margin:6px 0}
.result p{margin:4px 0}
.progress{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden;margin:12px 0}
.progress i{display:block;height:100%;background:var(--gold);border-radius:5px}
.alloc{display:grid;grid-template-columns:minmax(0,1fr) 72px;gap:4px 10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.alloc label{font-size:14px}
.alloc input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--gold)}
.alloc input[type=number]{width:72px;border:1px solid var(--line);border-radius:8px;padding:4px 6px;background:var(--surface);text-align:right;font-size:16px}
.remain{position:sticky;top:-8px;z-index:2;background:var(--bg);padding:8px 0;display:flex;justify-content:space-between;font-weight:700;border-bottom:1px solid var(--line)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{padding:12px 4px;font-size:14px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card h3{font-size:16px;margin-bottom:6px}
.card p{margin:0 0 10px;font-size:14px;color:var(--muted)}

/* letters */
.envelopes{display:flex;flex-direction:column;gap:10px}

.envelope::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,transparent 49.5%,var(--paper-line) 50%,transparent 50.5%),linear-gradient(20deg,transparent 49.5%,var(--paper-line) 50%,transparent 50.5%);background-size:100% 60%;background-repeat:no-repeat;opacity:.55;pointer-events:none}

.letter-top{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;color:#E9DFC4}

/* lightbox */
#lightbox{position:fixed;inset:0;z-index:90;background:#000000eb;display:flex;flex-direction:column}

#lightbox .lb-prev{left:10px}#lightbox .lb-next{right:10px}

const KEY='meridies-proto-v11';

function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){if(!saveWarned){saveWarned=true;toast('브라우저 저장 공간이 부족해요. 새로고침하면 일부 이미지가 사라질 수 있어요.')}}}

function notify(to,text,link){S.notifs.unshift({id:uid(),to,text,link,at:now(),read:false})}
function unreadCount(){
  const c=S.me;let n=S.notifs.filter(x=>x.to===c&&!x.read).length;
  n+=S.threads.filter(t=>(t.a===c||t.b===c)).reduce((a,t)=>a+t.letters.filter(l=>l.from!==c&&!l.read&&l.deliverAt<=now()).length,0);
  const j=me().job;if(j&&now()-j.start>=2*H)n++;const sj0=me().studyJob;if(sj0&&now()-sj0.start>=STUDY_MS)n++;
  return n}

const TABS=[['timeline','타임라인','timeline'],['dorm','기숙사','dorm'],['calendar','달력','cal'],['shop','상점','shop'],['more','더보기','more']];

function render(){

  $('#topbar').innerHTML=(root?`<div class="brand"><svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="12" style="fill:var(--gold)"/><circle cx="17.5" cy="12" r="10.5" style="fill:var(--bg)"/></svg><b>메리디에스</b><span class="lat">Meridies</span></div><span class="title" style="display:none"></span>`
     :`<button class="icon-btn" data-act="back" aria-label="뒤로">${ic('back')}</button><span class="title">${esc(view.title||TITLES[view.name]||'')}</span>`)
   +`<span class="spacer"></span><button class="icon-btn char-btn" data-act="openDrawer" aria-label="캐릭터 메뉴 열기">${avatar(m,S.stage)}${n?`<span class="badge">${n}</span>`:''}</button>`;
  $('#tabbar').innerHTML=`<div class="rail-brand"><b>메리디에스</b><span class="lat muted">Meridies · 루체른 황립 아카데미</span></div>`+TABS.map(([k,l,i])=>`<button class="tab" data-act="tab" data-v="${k}" ${view.name===k||(k==='dorm'&&view.name==='scene')?'aria-current="page"':''}>${ic(i)}<span>${l}</span></button>`).join('');
  $('#charfab').innerHTML=`${avatar(m,S.stage)}<span>${esc(m.name)}</span>${n?`<span class="badge">${n}</span>`:''}`;
  const keep={};['post-in','rp-in'].forEach(id=>{const e=document.getElementById(id);if(e&&!e.closest('#sheet-root'))keep[id]=e.value});
  $('#main').innerHTML=(V[view.name]||V.timeline)(view);
  Object.entries(keep).forEach(([id,v])=>{const e=document.getElementById(id);if(e)e.value=v});refreshPrev();
  if(view.name==='room'||view.name==='scene'||view.name==='dorm')requestAnimationFrame(()=>window.scrollTo(0,document.body.scrollHeight));

/* --- 문서 --- */
function md(src){
  return src.trim().split(/\n\s*\n/).map(b=>{b=b.trim();
    if(b.startsWith('## '))return `<h2 id="${'s'+uid()}">${esc(b.slice(3))}</h2>`;
    if(b.startsWith('### '))return `<h3>${esc(b.slice(4))}</h3>`;
    if(b.startsWith('> '))return `<p class="lead">${esc(b.slice(2))}</p>`;
    const lines=b.split('\n');
    if(lines.every(l=>/^\* /.test(l)))return `<ul>${lines.map(l=>`<li>${inl(l.slice(2))}</li>`).join('')}</ul>`;
    if(lines.every(l=>/^\d+\. /.test(l)))return `<ol>${lines.map(l=>`<li>${inl(l.replace(/^\d+\. /,''))}</li>`).join('')}</ol>`;
    return `<p>${lines.map(inl).join('<br>')}</p>`}).join('')}
const inl=s=>esc(s).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
function docView(src){const h=[...src.matchAll(/^## (.+)$/gm)].map(x=>x[1]);const html=md(src);
  let i=0;const withIds=html.replace(/<h2 id="[^"]+">/g,()=>`<h2 id="h${i++}">`);
  return `<div class="toc">${h.map((t,k)=>`<button class="chip" data-act="jump" data-id="h${k}">${esc(t)}</button>`).join('')}</div><article class="doc">${withIds}</article>`}

  $('#drawer-root').innerHTML=`<div class="scrim" data-act="closeDrawer"></div><aside class="drawer" role="dialog" aria-label="캐릭터 메뉴">

const WORLD=`> 이 문서는 전원 공개입니다. 여기 적힌 것은 제국력 828년, 루체른에 입학하는 열한 살 아이가 알고 있어도 이상하지 않은 상식과 소문의 전부입니다. 캐릭터는 이 이상을 알지 못한 채 이야기를 시작합니다.

## 세계: 아우렐 제국

당신들이 사는 곳은 대륙의 패권 국가, 아우렐 제국입니다. 황제와 귀족과 평민이 있는 신분제 사회이고, 제국의 문장은 '금빛 원'입니다. 그 원이 무엇을 본뜬 것인지는 아무도 모릅니다, 그냥 옛날부터 그랬습니다.

그리고 이 신분과는 별개로, 세상 사람은 한 번 더 둘로 나뉩니다. 마법을 타고난 솔렌과, 그렇지 않은 보통 사람 오르디니. 귀족 중에도 오르디니가 있고 평민 중에도 솔렌이 있습니다. 다만 솔렌은 오래도록 제국의 축복이자 기둥으로 대접받아 왔습니다. 적어도, 태양이 온전하던 시절에는.

## 마법: 그리고 5년 전에 밝혀진 진실

마법은 숨겨진 것이 아닙니다. 거리의 등불을 손보는 것도, 흉작의 밭을 살리는 것도, 아픈 사람을 치유하는 것도 솔렌의 일입니다. 천 년 동안 사람들은 마법을 그저 하늘이 내린 축복이라 여겼습니다. 어디서 오는지는 아무도 묻지 않았습니다. 공기가 어디서 오는지 묻지 않는 것처럼.

그 통념은 당신들이 다섯 살이던 해에 무너지기 시작했습니다. 마법의 원천은 태양이었습니다. 마법 사고율과 주문 실패율이 일조시간 그래프와 정확히 겹친다는 사실이 밝혀진 것입니다(제국력 822년). 처음에 학계는 비웃었다고 합니다, "마법이 햇빛에서 온다니, 그럼 우리가 밀이란 말인가." 그러나 이듬해(823년) 재현 실험으로 사실이 확정되었고, 지금은 아무도 웃지 않습니다.

같은 해(823년), 어원학자들이 기묘한 사실 하나를 보탰습니다. '솔렌'이라는 말 자체가, 뜻이 잊힌 옛말로 "해에 닿은 자"였다는 것. 선조들은 알고 있었다는 뜻입니다. 그런데 그 지식은 어디로 갔을까요? 잊힌 걸까요, 아니면, 누군가 지운 걸까요? 어른들은 술자리에서 이 이야기를 하다가도, 아이가 들어오면 화제를 바꿉니다. 답을 아는 사람은 아무도 없습니다.

## 검은 정오: 당신들이 태어난 해

제국력 817년 6월 21일. 1년 중 태양이 가장 높이 뜨는 날, 사람들이 솔스티스(Solstice)라 부르는 그 날의 정오에, 예정에 없던 개기일식이 태양을 삼켰습니다. 천문학적으로 불가능한 일이었고, 어둠은 예고 없이 47분간 이어졌습니다. 사람들은 그것을 '검은 정오'라 부릅니다.

그날 이후 세상은 예전으로 돌아가지 않았습니다. 일식은 해마다 잦아지고 길어지더니, 822년부터는 아예 매일 정오 무렵 태양이 가려지는 것이 일상이 되었습니다. 천문원은 이것을 '차폐 현상'이라 이름 붙였지만, 원인은 오늘까지도 밝혀내지 못했습니다. 이제 사람들은 "일식이 왔다"고 말하지 않습니다. "오늘 빛은 몇 시간"이라고 말합니다.

올해, 828년의 하루 실효 일조는 약 여섯 시간입니다. 그리고 매년 조금씩 줄고 있습니다. 작년 제국 중부에서는 기상학적 여름이 공식적으로 사라졌습니다. 이제 사계절이 전부 겨울입니다. 당신들은 온전한 태양을 본 적이 없습니다. 여름이라는 계절을, 책과 어른들의 회상으로만 압니다. 그래도 말은 남았습니다. 달력에는 여전히 "여름 방학"이 인쇄되고, 어른들은 유난히 덜 추운 날이면 "봄 같다"고 합니다. 사계절의 이름은 이제 온도가 아니라 겨울의 깊이를 재는 단위입니다. 옛 여름 자리는 옅은 겨울, 옛 겨울 자리는 깊은 겨울.

## 솔리스 배급제: 빛으로 사는 법

마법의 원천이 태양이라는 사실이 밝혀진 뒤, 사람들은 빛을 병에 담기 시작했습니다. 빛을 그릇에 담는 기술 자체는 옛날부터 있었지만(등불 대용의 생활 마법 같은), 그건 어디까지나 소품 규모였습니다. 물컵은 있었지만 댐은 없었던 셈입니다. 대규모 저장 기술은 지금도 발전 중이고, 그래서 재작년(826년)부터 제국은 솔리스 배급제를 시행하고 있습니다.

각 가정과 기관에는 표준 용기, 솔리스(Solis), 고어로 '태양의', 에 담긴 햇빛이 배급됩니다. 병을 흔들면 잔량을 가늠할 수 있고, 아이들은 등굣길에 제 몫의 병을 코트 안쪽에 품고 다닙니다.

저장 마법에는 누구나 배우는 네 가지 규칙이 있습니다.

1. **채집은 실시간뿐:** 빛이 실제로 비치는 순간, 비치는 곳에서만 담을 수 있습니다. 지나간 빛을 되살리거나 복제할 수는 없습니다. 그래서 낮이 줄면 모을 수 있는 빛도 함께 줍니다, 배급이 늘 빠듯한 이유이자, 비축이 쌓이지 않고 어제 모은 것을 오늘 나누는 자전거 조업이 되는 이유입니다.
2. **저장한 빛은 샌다:** 완벽한 보존은 불가능합니다. 좋은 용기일수록 느리게 샐 뿐. 모아두면 영원한 것이 아닙니다.
3. **빛에는 등급이 있다:** 정오의 직사광과 새벽의 박명은 값이 다릅니다. 최상급은 '검은 정오 이전에 담긴 빛', 그 시절엔 아무도 빛을 모을 이유가 없었으니, 우연히 남은 것들뿐이라 금값입니다.
4. **사람의 몸에는 담을 수 없다:** 시도는 전부 실패했거나, 끔찍하게 끝났다고 합니다. 마도원이 정식으로 금지한 이 네 번째 규칙을 사람들은 '제4금기'라 부릅니다. 수업 첫날 배우고, 아무도 이유를 깊게 묻지 않는 종류의 금기입니다.

그리고 빛은 사실상 화폐입니다. 화폐가 있는 곳에는 암시장이 있다고들 합니다.

## 녹스본: 당신들의 세대

검은 정오 이후에 태어난 아이들을 세상은 녹스본, "밤에 태어난 자들", 이라 부릅니다. 좋은 뜻으로 부르는 말이 아닙니다.

이유가 있습니다. 녹스본 아이들은 하나같이 빛 마법 재능이 형편없습니다. 이론을 아무리 외워도 실기가 따라오지 않습니다. 어른들은 수군거립니다, "축복이 마른 세대"라고. 검은 태양이 뜬 해에 태어난 게 불길하다고, 저 아이들이 뭔가 잘못된 거라고. 면전에 대고 말하는 어른은 드물지만, 아이들은 압니다. 수군거림은 언제나 면전보다 잘 들리는 법이니까.

올해 루체른 입학생은 817년생, 즉 상반기에 태어난 '보통' 아이들과, 솔스티스 이후에 태어난 녹스본이 한 교실에 섞이는 첫 기수입니다.

## 루체른 황립 아카데미

제국 유일의 7년제 마법 학교. 제국에 아카데미야 많습니다. 법학이니 의학이니 상학이니. 그러나 마법을 가르치는 곳은 제국을 통틀어 이곳 하나뿐입니다. 마법의 재능이 그만큼 드물기 때문입니다.

마법의 재능은 일곱에서 아홉 살 사이에 깹니다. 그보다 늦게 깨는 일은 없다시피 해서, 열 살 생일이 지나면 어른들은 조용히 화제를 접습니다. 조짐은 제각각입니다. 잔의 물이 저 혼자 언다거나, 아이가 크게 운 날 시계가 멎는다거나. 그러면 순회 판정관이 보카티오, '부름'이라는 이름의 작은 은종을 들고 옵니다. 재능이 깬 아이가 손을 대면, 치지도 않은 종이 낮게 웁니다. 부름을 받았다고들 하지요. 다만 종은 재능이 깼다는 것만 알려줍니다. 그 재능이 무슨 빛깔인지는, 루체른의 화로만이 읽을 수 있습니다.

종이 운 아이는 제국 명부에 올라, 열한 살이 되는 해 9월 1일에 입학합니다. 입학 여정은 걱정할 것 없습니다. 늦여름이면 아카데미가 보낸 마차가 집 앞까지 옵니다. 안내인과 함께, 그 지역의 아이들을 하나씩 태우면서요. 귀족집 아이든 수리공집 아이든 같은 마차를 탑니다. 사양은 안 됩니다. 입학은 가문의 일이 아니라 부름의 일이라서요. 길가 사람들은 이 행렬을 등불 마차라고 부릅니다.

한 해에 150명 남짓. 천 명이 넘는 또래 중에 하나 나올까 말까 한 숫자라, 마법사가 난 집은 마을의 자랑이 됩니다. 올해 828년의 신입생은 재능이 깬 817년생 전원, 약 150명입니다. 전교생은 일곱 학년을 합쳐 천 명쯤 됩니다. 참고로 어른들은 아직도 이것을 "가을 학기"라고 부릅니다. 여러분 세대에게 가을은, 책과 어른들의 이야기로만 아는 계절입니다.

이름은 옛말로 '등불'이라는 뜻입니다. 제국 건국기, 옛 태양 관측소 자리에 네 창립자가 세웠다고 역사는 기록합니다.

## 다섯 학부

학부는 다섯입니다. 넷에는 이름과 이념과 색이 있습니다.

1. **아우로라(Aurora):** "마법에는 상상력이 뛰어난 자들이 필요하다." 새벽의 학부. 상징색은 버건디, 해 뜨기 직전 새벽놀의 짙은 포도주빛.
2. **베스퍼(Vesper):** "마법에는 호기심이 많은 자들이 필요하다." 저녁별의 학부. 상징색은 연두, 일몰의 마지막 찰나에만 번쩍인다는 초록 섬광. 끈질기게 지켜보는 자만 본다는 빛입니다.
3. **칸디다(Candida):** "마법에는 도덕적인 자들이 필요하다." 한낮의 학부. 상징색은 노랑, 숨을 곳 없는 대낮의 태양빛.
4. **아스트라(Astra):** "마법에는 야망이 있는 자들이 필요하다." 한밤의 학부. 상징색은 남보라, 별이 박히는 밤하늘의 바탕. 교훈은 "역경을 넘어 별에게로."

그리고 다섯 번째가 있습니다. 이름이 없습니다. 문장은 빈 원. 서류상 명칭은 그냥 '제5학부'입니다. 네 화로 어디에도 들지 못한 아이들이 가는 곳, 세간의 통설로는 "어느 기준에도 못 미친 아이들을 담는 행정상의 잉여 학부"입니다. 학생들은 이 학부에 별명을 지어주는 수고조차 하지 않았습니다. 다만 그 소속 학생만은 부르는 말이 있습니다. '언릿(the Unlit)'. 불이 켜지지 않은 아이들. 좋은 뜻의 말이 아닙니다. 기숙사는 볕이 가장 안 드는 북편이고, 학부 대항전 순위표에는 관례상 이름조차 오르지 않습니다.

왜 없애지 않고 두는지는 아무도 모릅니다. 800년 전통이라고만 합니다.

학부마다 기숙사의 풍습도 다릅니다. 아우로라의 공용 벽은 누구나 그림과 시를 남길 수 있고 매주 지워집니다 (지워지는 것이 규칙입니다). 베스퍼의 문은 매일 밤 관찰 문제를 내며, 못 풀면 기숙사생이라도 못 들어갑니다. 칸디다에는 자물쇠가 하나도 없습니다. 방문에도, 서랍에도. 숨길 것이 없는 자들의 집이라서요. 아스트라의 방과 좌석에는 서열이 있고, 서열은 성적과 공인된 내기로 뺏고 뺏깁니다. 그리고 제5학부에는, 규칙이 없습니다. 규정집에 항목 자체가 없거든요. 애초에 사람도 없습니다. 무색 판정은 해에 두엇 나올까 말까 한 것이라, 일곱 학년을 다 합쳐도 스무 명이 못 되는 게 보통이었습니다. 올해는 열 명이 들었습니다. 개교 이래 가장 많은 숫자라고, 어른들이 이상한 얼굴로 말합니다.

## 마법에 대하여

먼저 이름 이야기. '광휘 마법'은 젊은 이름입니다. 검은 정오 전까지 사람들은 그것을 그냥 마법이라 불렀고, 마법은 지금보다 훨씬 폭이 넓은 기술이었습니다. 불을 밝히고 끄는 것은 물론, 물을 데우고, 바람을 부르고, 흙과 물과 불을 다루고, 마력의 흐름을 감지하고. 빨래를 말리고 수레를 미는 생활의 잔재주부터 강줄기를 돌리는 대마법까지. 폭은 마법사의 그릇에 따라 제각각이었지만, 그 힘이 어디서 오는지는 아무도 몰랐습니다. 몸 안의 '마력'을 태운다고만 알았지요.

해가 죽어가자, 마법이 함께 시들었습니다. 대마법사들의 큰 주문이 먼저 말을 듣지 않았고, 생활의 잔재주들이 뒤를 따랐습니다. 그제야 세상은 근원을 알았습니다. 마력이라 부르던 것은, 사람이 볕을 쬐며 저도 모르게 몸에 쌓아 온 햇빛이었다는 것을. 마법이란 그 빛을 태우는 재주였고, 해가 사라진 세상에서는 태울 것이 말라 갔던 겁니다. 그 뒤로 학문은 빛을 중심으로 다시 쓰였고, 이름도 광휘 마법이 되었습니다 (빛 개론이 신설된 것도 그때입니다). 나이 든 교수들 중에는 아직 옛 버릇대로 그냥 '마법'이라 부르는 이들이 있습니다.

### 맨몸으로 쓸 수 있는 것 (학교 수업의 표준)

하루 몇 시간의 볕으로 몸에 쌓이는 빛이 워낙 적어, 병에 든 빛 없이 제 몸만으로 부리는 요즘의 마법은 연료가 덜 드는 잔재주들로 좁아졌습니다. 빛을 만들고 (손바닥 위의 구슬, 방을 밝히는 등불), 모양을 잡고 (새, 글자, 움직이는 작은 상: 빛의 그림이라 만지면 아무것도 없습니다), 색을 입히고, 벽에 표식을 남기고, 순간 눈부시게 하고 (섬광), 촛불 심지에 불을 옮겨 붙이고, 사물에 밴 미광을 읽는 것 정도. 상급자라면 빛을 한 점에 모아 종이를 그을리는 데까지. 그것이 요즘 화력의 상한입니다.

### 솔리스를 태우면 (빛의 급간)

다만 위의 목록을 마법의 천장으로 읽으면 안 됩니다. 저것은 배급 살림의 마법이고, 병을 따는 순간 이야기가 달라집니다.

먼저 원리 하나. 빛은 빛으로 쓰는 것이 가장 쌉니다. 병에 든 것이 햇빛이니, 빛을 내는 데는 고스란히 들어가고, 열이나 힘이나 바람으로 바꾸는 데는 태반이 새어 나갑니다. 그래서 같은 병이라도 빛의 일은 크게, 옛 원소의 일은 작게 됩니다. 학문이 빛 중심으로 다시 쓰인 것은 취향이 아니라 이 셈법 때문입니다.

* **하급 한 병:** 잔재주가 재주가 됩니다. 방 하나를 밤새 밝히는 등. 며칠을 버티는 표식. 실물 크기로 움직이는 빛의 상. 촛불 심지가 아니라 화톳불을 단번에 일으키는 집광. 그리고 옛 마법의 흉내라면, 찻주전자를 데우고, 젖은 외투 한 벌을 말리고, 방 안에 바람 한 줄기를 부르는 정도.
* **중급 한 병:** 재주가 힘이 됩니다. 거리 하나를 끝까지 밝히는 빛기둥. 수십 보 밖을 대낮처럼 비추는 탐조. 한 점에 모아 판금을 그을려 끊는 집광. 무리 전체의 눈을 한동안 앗는 대섬광. 만든 사람이 자리를 떠도 한나절을 버티는 빛. 원소 쪽이라면, 물 한 통을 끓이고, 짐수레 하나를 언덕 위까지 밀어 올리고, 작은 돛 하나에 바람을 채우고, 무너진 흙더미를 사람 몇 몫으로 파헤치는 정도.
* **상급:** 힘이 위엄이 됩니다. 수십 리 밖 배들이 보고 길을 잡는 등탑의 불. 겨울 온실을 살리는 인공 채광. 광장 하나를 통째로 낮으로 만드는 빛. 어둠 속의 것들이 넘지 못하는 빛의 장막. 원소 쪽이라면 옛 대마법의 초입까지. 겨울 강의 얼음을 가르고, 무너진 성문을 밀어 세우는 정도. 다만 같은 병으로 빛이면 광장 하나, 원소면 성문 하나입니다. 바꾸는 값이 그렇게 비쌉니다. 상급 한 병이면 작은 마을의 한 달 치 밤을 사는 값이라, 상급을 태우는 마법은 그 자체로 권력의 과시이기도 합니다.
* **이론서 속에만 남은 것:** 원소를 다루고 수레를 밀던 옛 마법들은 사라진 것이 아니라, 연료가 없는 것입니다. 이론은 도서관에 고스란히 남아 있고, 솔리스를 통째로 쏟아부으면 흉내도 내겠지만. 물 한 동이를 마법으로 데우는 값이면 장작 한 달치를 삽니다. 그래서 아무도 하지 않습니다.

### 예나 지금이나 못 하는 것

상처를 치유하지 못합니다 (치유는 약초와 의술의 일입니다. 마법의 폭이 넓던 시절에도 그랬습니다). 죽은 것을 살리지 못하고, 사람의 마음을 바꾸지 못하고, 어둠 그 자체를 물리치지 못합니다. 어둠 속에 등 하나를 켤 뿐입니다.

### 연료와 지속

제 몸에 쌓인 빛으로 낸 마법은 작고 짧으며, 술자가 곁을 떠나면 곧 스러집니다. 솔리스를 먹인 마법은 크고 오래갑니다. 그래서 이 세계에서 마법의 크기는 재능 절반, 병에 든 빛 절반입니다.

## 돈과 물가

제국의 화폐는 은화 탈러와 동화 그로셴입니다 (1탈러 = 20그로셴). 감을 잡으시라고, 여러분이 입학하던 828년의 값을 몇 개 적어 둡니다.

* 달걀 하나: 1그로셴 (검은 정오 전에는 한 닢에 두 알이었다고, 어른들은 아직도 말합니다)
* 온실 사과 한 알: 2그로셴 (그래서 학교 아이들 사이에서 화폐 노릇을 합니다)
* 인쇄된 책 한 권: 2~4탈러 (필사본은 부르는 게 값)
* 평범한 겨울 외투 한 벌: 5탈러 (교복과 기본 방한구는 학교가 지급합니다)
* 솔리스 중급 한 병: 15탈러. 그리고 상급은, 값이 있다기보다 임자가 있습니다.

다만 이 값은 828년의 것입니다. 다음 해의 값은 아무도 장담하지 않습니다. 어둠이 깊어질수록 돈은 가벼워지고 빛과 먹을 것은 무거워져서, 요즘 시장에서는 은화보다 병에 든 빛이 먼저 통하는 날도 있습니다. 학년이 오를수록, 같은 물건의 값이 조금씩 올라 있을 것입니다.

## 학교를 거니는 법

먼저 위치부터. 루체른은 수도 안에 있지 않습니다. 수도에서 마차로 한나절, 오래된 숲을 등진 근교 언덕이 학교의 자리입니다. 800년 전 세워질 때부터 그랬습니다: 배움에는 도시의 소음보다 먼 거리가 낫다고 여긴 사람들이 지은 학교라서요. 전교생이 기숙사에 사는 것도 절반은 이 거리 때문이고, 부지가 이렇게 넓은 것도 근교라서 가능한 일입니다. 밤이 긴 시대라, 맑은 저녁이면 수도 쪽 지평선이 등불빛으로 옅게 물드는 것이 담장 너머로 보입니다. 아이들은 그쪽을 보며 집 생각을 합니다.

루체른은 걸어서 한나절이면 다 도는 크기입니다. 다만 처음 온 사람은 꼭 한 번은 길을 잃습니다. 800년 동안 필요할 때마다 덧대어 지은 학교라서요.

* **첨탑과 본관:** 어디서든 보이는 첨탑이 학교의 한가운데입니다. 첨탑을 낀 본관은 지상 4층, 교실이 예순 남짓 되는 큰 건물인데, 그래도 천 명의 수업을 혼자 다 담지는 못합니다. 본관을 두르는 긴 회랑에는 학기마다 학생들의 그림과 습작이 걸립니다.
* **별관 (동관과 서관):** 본관이 넘긴 수업을 받는 강의동 둘. 대강의실과 실기 연습실이 이쪽에 모여 있습니다 (교칙이 말하는 그 '지정 연습실'이 바로 여기입니다). 서관 3층에서 동관 2층으로 이어지는 복도 같은 것이 아무렇지 않게 존재합니다.
* **대연회장:** 본관에 붙은 가장 큰 홀. 다섯 개의 화로가 있는 그곳입니다. 입학식과 졸업식, 그리고 학부 만찬이 여기서 열립니다.
* **도서관:** 본관 뒤편의 독립 건물. 누구나 쓰는 열람실과, 허가가 필요한 안쪽 서고로 나뉩니다.
* **네 학부 기숙사:** 본관을 둘러싸고 학부마다 한 동씩. 굴뚝과 창틀에 제 학부의 색을 조금씩 칠해 두어서, 멀리서도 어느 집인지 알 수 있습니다. 아스트라 동의 옥상에는 천문대가 있는데, 이것만은 전교에 개방됩니다. 별은 독점하지 않는 거라고, 그 집답지 않게 낭만적인 전통입니다.
* **제5학부 기숙사:** 부지 북편 끝, 다른 기숙사들과 뚝 떨어진 자리에 홀로 서 있습니다. 건물은 어느 동 못지않게 큰데, 사는 사람이 늘 적습니다. 사감도, 순찰도 없습니다. 규정집에 제5학부 항목 자체가 없어서요.
* **거울 호수:** 부지 가장자리의 인공호. 물이 잔잔해 붙은 이름입니다. 호숫가에 낡은 보트하우스가 하나 있고, 수영은 사철 금지입니다. 수심 때문이라고들 합니다.
* **교원 사택:** 교수와 사감의 태반이 학교 안에서 삽니다. 부지 동편, 낮은 돌집들이 모인 구역. 저녁마다 그 창들에 불이 하나둘 켜지는 것을 보고, 아이들은 오늘 어느 선생이 밤을 새우는지 압니다.
* **온실:** 배급 시대의 보물 창고. 학교 식탁의 야채와 과일 태반이 여기서 나고, 온실 사과는 아이들 사이에서 화폐 노릇을 합니다.
* **옛 창고 지구:** 본관에서 좀 떨어진, 오래된 창고들이 늘어선 구역. 관리인 요제프 그로프 씨의 왕국이며, 벌점 노역의 단골 장소입니다.

## 마법과 교칙

규정집 제3장: 마법 사용은 수업 시간과 지정 연습실 안에서만 허용됩니다. 복도에서도, 기숙사에서도, 안뜰에서도 금지. 빛이 귀한 시대에 빛을 낭비하지 말라는 취지의, 검은 정오 이후 신설된 조항입니다. 다만 오래된 학교의 규정이 다 그렇듯, 집행은 관례를 탑니다: 손바닥 위의 불빛 한 점, 식탁의 작은 재주 같은 것은 어른들이 못 본 척하는 것이 보통이고, 그 이상 (복도를 밝히며 다니기, 밤중의 큰 빛)은 적발 시 벌점입니다. 요컨대 켜는 것은 눈감아 주되, 티 나게 쓰면 걸립니다.

## 학년의 시간표

필수 과목은 전원이 듣고, 4학년부터 선택 과목이 열립니다 (매 학기 둘 이상 선택, 지원자가 모자란 과목은 폐강).

전 학년 공통 필수, 광휘 마법 실습: 1학년의 빛 구슬부터 7학년의 졸업 실기까지, 한 해도 빠지지 않는 유일한 과목입니다. 그리고 유일하게 다섯 학부를 섞어 반을 짜는 과목이기도 합니다. 학부끼리만 뭉치면 색과 색 사이에 벽이 선다는, 개교 이래의 지론으로요.

### 1학년 (전부 필수)

* **광휘 실습 (기초):** 손바닥 위의 빛 구슬. 만들고, 삼십 초를 버티는 것부터.
* **마법 이론 입문:** 마법이 무엇을 할 수 있고 무엇을 할 수 없는지, 그 경계의 교과서.
* **빛 개론:** 검은 정오 이후 신설된 이론 과목. 햇빛이 무엇이고 어디서 오며 왜 줄어드는지를 학술로 다룹니다. 답보다 물음이 많은 과목이라, 교재가 해마다 얇아진다는 농담이 있습니다.
* **제국어와 글쓰기:** 읽고, 쓰고, 편지 짓는 법.
* **셈법:** 사칙과 분수, 무게와 부피의 어림.
* **자연 견문:** 식물과 계절, 날씨 읽기, 밤하늘 보기의 기초.
* **예법과 생활:** 인사와 식탁과 편지의 격식. 기숙 생활의 기본기.
* **기초 단련:** 몸 쓰기와 걷기. 어두운 세상에서는 이것도 생존 기술입니다.
* **노래와 그림:** 목소리와 손을 쓰는 시간.

### 2학년 (전부 필수)

* 광휘 실습, 마법 이론, 빛 개론, 제국어 강독, 셈법 심화, 제국 지리, 온실 실습, 기초 단련, 노래와 그림

### 3학년 (전부 필수)

* 광휘 실습 (중급), 마법사학, 마법 이론, 수사학과 작문, 제국 지리 심화, 약초학, 온실 실습, 기초 단련

### 4학년 (필수 일곱 + 선택 둘 이상)

* 필수: 광휘 실습, 마법사학, 제국사, 마도구의 이해, 수사학과 작문, 온실 실습, 기초 단련
* 선택: 고어 입문, 천문학, 신수와 옛 짐승, 회화와 도안, 악기, 법 입문

### 5학년 (필수 여섯 + 선택 둘 이상)

* 필수: 광휘 실습 (상급), 마법사학, 제국사, 법과 규정, 빛의 경제, 기초 단련
* 선택: 고어 강독, 천문 관측, 회화 심화, 치유 실무, 옛 문학

### 6학년 (필수 다섯 + 선택 셋 이상)

* 필수: 광휘 실습, 연구 방법, 근세사, 빛의 경제 심화, 기초 단련
* 선택: 4~5학년 선택 과목의 심화 전 과정

### 7학년 (필수 셋 + 선택)

* 광휘 실습 (졸업 실기), 자유 연구 완성, 도제 실습

과목이 같아도 학부마다 잘하는 것이 다르고, 그 강세가 곧 학부의 평판이 됩니다. 그림과 창작이라면 아우로라, 세는 일과 캐는 일이라면 베스퍼, 규정과 논술이라면 칸디다, 별과 셈이라면 아스트라: 그런 식으로요.

## 성적 (다섯 단계)

800년 된 학교라 성적표도 옛말로 적습니다. 위에서부터:

* **옵티메 (Optime):** 더할 나위 없음. 한 학년에 과목당 몇 명 안 나옵니다. 학기말에 옵티메의 수를 세어 수석을 가리고, 그 수석이 어느 학부에서 나오는가로 내기판이 섭니다.
* **베네 (Bene):** 잘함.
* **사티스 (Satis):** 충분함. "사티스면 산다"는 것이 대다수 학생의 생활 신조입니다.
* **빅스 (Vix):** 겨우. 재시험 대상입니다.
* **니힐 (Nihil):** 낙제. 유급의 사유가 되고, 두 해를 거듭하면 부모 앞으로 편지가 갑니다.

그리고 하나 더: 광휘 실습의 성적은 성적표 밖에서도 힘을 씁니다. 학생 솔리스 배급이 실기 등급에 비례하거든요. 옵티메는 넉넉히, 사티스는 빠듯이, 빅스와 니힐은 바닥에 깔린 만큼. 규정은 누구에게나 같지만, 그 결과가 누구에게나 같지는 않습니다.

## 떠도는 소문들

어디까지가 사실인지는 아무도 모릅니다. 당신들도 어디선가 주워들었을 뿐입니다.

* **재의 교단 (Ashes):** 어둠을 '정화'라 믿는 광신 집단이 있다고 합니다. 태양이 완전히 꺼져야 새 세상이 온다고 믿는다나요. 실체를 봤다는 사람은 드물지만, 흉흉한 시절에 흉흉한 무리가 없을 리 없다고 어른들은 말합니다.
* **지워진 지식:** '솔렌'의 어원처럼: 선조들이 알았던 무언가가 지워졌다는 이야기. 학자들 사이에서는 진지한 논쟁이고, 시정에서는 음모론입니다.
* **신분:** 황실이 있고, 귀족이 있고, 시민이 있고, 농민과 노동자가 있습니다. 늘 그랬듯이요. 다만 부름은 그걸 가리지 않습니다. 등불 마차는 대가문의 현관에도, 수리공의 집 앞에도 똑같이 섭니다. 학교 식당의 식탁에서도 그런지는, 다녀보면 알게 됩니다.
* **다른 나라의 마법사들:** 마법사는 제국에만 있는 게 아닙니다. 대륙 어디든 드물게 태어나지요. 그리고 어디든, 마법사들은 빛 앞에서 기원합니다. 아이를 보이고, 축복을 구하는 오래된 의례. 우리는 화로 앞에서 하고, 극북은 오로라 뜬 밤에 얼음 거울 앞에서 한다고 합니다. 다만 아이의 기질을 네 가지 색으로 읽어내는 것은 루체른의 화로만이 하는 일입니다. 극북 사람들은 거울에 서리는 무늬를 읽는다던가요. 저마다 다른 걸 읽고, 다르게 가른답니다.
* **자매탑들:** 제국에 마법 학교는 루체른 하나뿐이지만, 대륙 사방의 변경에는 루체른의 첨탑과 꼭 닮은 옛 탑이 넷 있다고 합니다. 사람들은 자매탑이라 부릅니다. 정확히는, 넷 '있었다'고 해야겠습니다. 서쪽 것은 옛 내전 때 부서진 뒤로 재건되지 않았으니까요. 남은 탑들은 수도회나 순례자들이 지키는 곳도 있고, 국경 너머 극북의 것은 그곳 사람들의 학당이 끼고 있다고도 합니다. 왜 닮았는지는 아무도 모릅니다. 요즘은 어디나 사정이 어렵다고 하고요.
